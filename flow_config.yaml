# =============================================================
#  板塊資金流向設定檔（存檔編碼請用 UTF-8）
# =============================================================

# 回放天數：網頁可以拖拉看最近幾個交易日的變化
replay_days: 10

# 板塊太小不畫（成分股少於幾檔）
min_members: 2

# 個股異常門檻：當日法人買賣超金額 ≥ 過去 20 日平均絕對值的幾倍，且至少幾億
anomaly_ratio: 3.0
anomaly_min_yi: 1.0

