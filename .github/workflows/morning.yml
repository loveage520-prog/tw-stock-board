name: 開盤前晨報

on:
  schedule:
    - cron: "30 23 * * 0-4"  # 台灣時間 07:30（週一～週五；備援，主要由 cron-job.org 觸發）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash cloud/data_pull.sh
      - run: python cloud/make_config.py
      - name: 產生晨報並推播
        run: |
          # GitHub 排程延遲到 10 點以後才跑就不推播（只更新網頁）
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date +%H%M)" -gt 1000 ]; then python morning_brief.py --no-push; else python morning_brief.py; fi
      - name: 更新網頁
        if: always()
        run: python cloud/build_site.py && bash cloud/git_push_dir.sh site gh-pages
      - name: 儲存
        if: always()
        run: bash cloud/data_push_part.sh "news" "morning_fragment.html"
