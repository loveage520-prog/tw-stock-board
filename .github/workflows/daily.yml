name: 盤後（資金流向、法人、籌碼、營收、美股）

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 台灣時間 18:00（週一～週五）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash cloud/data_pull.sh
      - run: python cloud/make_config.py
      - name: 抓盤後資料
        run: python cloud/daily.py
      - name: 更新網頁
        if: always()
        run: python cloud/build_site.py && bash cloud/git_push_dir.sh site gh-pages
      - name: 儲存快取
        if: always()
        run: bash cloud/data_push.sh
