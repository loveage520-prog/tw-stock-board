name: AI 營收資料（手動更新）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash cloud/data_pull.sh
      - run: python ai_fin.py
      - name: 樣本
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pulse_data/aifin/all.json'))
          for c in d['cos']:
              if c['c'] in ('2330','2382','3017'):
                  print(c['n'], 'months', len(c['m']), c['m'][-3:])
                  print('  quarters', len(c['q']))
                  for q in c['q'][-5:]: print('  ', q)
          print('missing', [c['n'] for c in d['cos'] if not c['m'] or not c['q']])
          PY
      - run: python cloud/build_site.py && bash cloud/git_push_dir.sh site gh-pages
      - run: bash cloud/data_push_part.sh "aifin" ""
