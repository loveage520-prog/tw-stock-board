name: 美股盤中＋收盤重點

on:
  schedule:
    - cron: "25 13 * * 1-5"  # 台灣時間 21:25（備援；主要由 cron-job.org 觸發）
    - cron: "0 19 * * 1-5"   # 台灣時間 03:00 接手後半段
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us
  cancel-in-progress: true   # 後半段啟動時取代前半段

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash cloud/data_pull.sh
      - run: python cloud/make_config.py
      - run: bash cloud/us.sh
