name: 盤中（台股盤中脈動＋成交排行）

on:
  schedule:
    - cron: "55 0 * * 1-5"   # 台灣時間 08:55（備援；主要由 cron-job.org 08:45 觸發）
  workflow_dispatch:

permissions:
  contents: write


jobs:
  check:
    # GitHub 自己的排程只當備援：3 小時內已經有人（cron-job.org）叫過這個工作，就不再重跑，避免 Telegram 收到兩次
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
            n=$(\
                gh api "repos/${{ github.repository }}/actions/runs?created=>$since&per_page=50" \
                --jq "[.workflow_runs[] | select(.name == \"${{ github.workflow }}\" and .id != ${{ github.run_id }} and (.conclusion == null or .conclusion == \"success\"))] | length")
            [ "${n:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "略過＝$skip"
  run:
    needs: check
    if: needs.check.outputs.skip != 'true'
    concurrency:
      group: intraday
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash cloud/data_pull.sh
      - run: python cloud/make_config.py
      - run: bash cloud/intraday.sh
