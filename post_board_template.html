<!--PB-START-->
<style>
/* 盤後籌碼與美股：樣式限定在 #pb 內，可單獨成頁或嵌進資金流向頁 */
#pb{
  --pb-card:#ffffff;--pb-fg:#1c2230;--pb-muted:#6b7280;--pb-line:#e3e6eb;--pb-soft:#eef1f5;
  --pb-up:#d6453d;--pb-up-bg:#fbe9e7;--pb-down:#1f8a55;--pb-down-bg:#e4f4ea;--pb-accent:#2f5fb3;
  color:var(--pb-fg);font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #pb{
  --pb-card:#171c23;--pb-fg:#e7eaf0;--pb-muted:#98a2b3;--pb-line:#272e38;--pb-soft:#1e242d;
  --pb-up:#ef6a5f;--pb-up-bg:#3a1f22;--pb-down:#3fbf7f;--pb-down-bg:#16302a;--pb-accent:#7aa4ff}}
:root[data-theme="dark"] #pb{
  --pb-card:#171c23;--pb-fg:#e7eaf0;--pb-muted:#98a2b3;--pb-line:#272e38;--pb-soft:#1e242d;
  --pb-up:#ef6a5f;--pb-up-bg:#3a1f22;--pb-down:#3fbf7f;--pb-down-bg:#16302a;--pb-accent:#7aa4ff}
#pb *{box-sizing:border-box}
#pb button,#pb input{font:inherit;color:inherit}
#pb .pb-top{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
#pb .pb-top button{padding:7px 14px;border-radius:9px;border:1px solid var(--pb-line);background:var(--pb-card);cursor:pointer;font-weight:600}
#pb .pb-top button.on{background:var(--pb-fg);color:var(--pb-card);border-color:var(--pb-fg)}
#pb .pb-meta{font-size:12px;color:var(--pb-muted);margin:0 0 8px}
#pb .pb-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media (max-width:760px){#pb .pb-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
#pb .pb-k{background:var(--pb-card);border:1px solid var(--pb-line);border-radius:10px;padding:8px 10px;min-width:0}
#pb .pb-k .t{font-size:12px;color:var(--pb-muted)}
#pb .pb-k .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#pb .pb-seg{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
#pb .pb-seg button{padding:5px 11px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--pb-muted)}
#pb .pb-seg button.on{background:var(--pb-soft);border-color:var(--pb-line);color:var(--pb-fg);font-weight:600}
#pb button:focus-visible,#pb input:focus-visible{outline:2px solid var(--pb-accent);outline-offset:1px}
#pb .pb-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
#pb .pb-chip{font-size:12px;padding:4px 9px;border-radius:8px;border:1px solid var(--pb-line);background:var(--pb-card);cursor:pointer;font-variant-numeric:tabular-nums}
#pb .pb-chip.on{border-color:var(--pb-accent);color:var(--pb-accent);font-weight:600}
#pb .pb-desc{font-size:12px;color:var(--pb-muted);margin-bottom:6px}
#pb .pb-tw{overflow-x:auto;background:var(--pb-card);border:1px solid var(--pb-line);border-radius:12px}
#pb table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#pb th,#pb td{padding:7px 8px;border-bottom:1px solid var(--pb-line);text-align:left;white-space:nowrap}
#pb th{font-size:12px;color:var(--pb-muted);font-weight:500}
#pb td.n,#pb th.n{text-align:right}
#pb td.pbrk{color:var(--pb-muted);text-align:right;width:36px}
#pb .up{color:var(--pb-up)}#pb .down{color:var(--pb-down)}
#pb .code{color:var(--pb-muted);font-family:ui-monospace,Consolas,monospace;font-size:12px;margin-left:6px}
#pb .sub{display:block;font-size:11px;color:var(--pb-muted)}
#pb .st{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:600}
#pb .st.b{background:var(--pb-up-bg);color:var(--pb-up)}#pb .st.s{background:var(--pb-down-bg);color:var(--pb-down)}
#pb .ma{font-size:11px;letter-spacing:1px}
#pb svg.sp{display:block}
#pb .hm{display:none}
@media (max-width:640px){#pb .sub{white-space:normal;max-width:9.5em;line-height:1.3}#pb .hm{display:none!important}#pb .hd{display:none}#pb th,#pb td{padding:7px 5px}}
@media (min-width:641px){#pb .hm{display:table-cell}}
#pb .pb-note{font-size:12px;color:var(--pb-muted);line-height:1.7;margin-top:8px}
#pb .pb-empty{color:var(--pb-muted);padding:18px;text-align:center}
</style>
<div id="pb">
  <div class="pb-top" id="pb-top">
    <button data-v="外資" class="on">外資 15 日</button>
    <button data-v="投信">投信 15 日</button>
    <button data-v="us">美股成交前 100</button>
  </div>
  <div id="pb-view"></div>
</div>
<script>
(function(){
const P = /*__DATA__*/null;
if (!P) return;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v == null ? "—" : (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const yi = v => v == null ? "—" : (v > 0 ? "+" : "") + (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2));
let top = "外資", sub = "buy", sec = "";

function spark(a){  // 15 日每日買賣超小長條
  const w = 4, gap = 1, h = 22, mx = Math.max(...a.map(x => Math.abs(x || 0)), 0.01);
  return `<svg class="sp" width="${a.length * (w + gap)}" height="${h}" viewBox="0 0 ${a.length * (w + gap)} ${h}" aria-hidden="true">` +
    a.map((x, i) => { const v = x || 0, bh = Math.max(Math.abs(v) / mx * (h / 2 - 1), 1);
      return `<rect x="${i * (w + gap)}" y="${v >= 0 ? h / 2 - bh : h / 2}" width="${w}" height="${bh}" fill="${v >= 0 ? "var(--pb-up)" : "var(--pb-down)"}"/>`; }).join("") + "</svg>";
}
function streak(s){
  if (s > 0) return `<span class="st b">連買 ${s} 天</span>`;
  if (s < 0) return `<span class="st s">連賣 ${-s} 天</span>`;
  return "";
}
const SUBS = {buy: "15 日買超前 30", sell: "15 日賣超前 30", cbuy: "連續買超 ≥5 天", csell: "連續賣超 ≥5 天"};
const SUBDESC = {
  buy: "近 15 個交易日累計買超金額最多的 30 檔",
  sell: "近 15 個交易日累計賣超金額最多的 30 檔",
  cbuy: "到最近一個交易日為止，連續買超 5 天以上的股票中，15 日累計買超金額前 30",
  csell: "到最近一個交易日為止，連續賣超 5 天以上的股票中，15 日累計賣超金額前 30"
};
function tw(){
  const T = P.tw;
  if (!T){ $("pb-view").innerHTML = `<div class="pb-empty">台股法人資料尚未產生</div>`; return; }
  const D = T.data[top];
  const rows = D[sub] || [];
  $("pb-view").innerHTML = `
    <p class="pb-meta">${T.from}～${T.to}・${T.days} 個交易日・產生 ${P.generated}${P.demo ? "・示範資料" : ""}</p>
    <div class="pb-kpis">
      <div class="pb-k"><div class="t">${top} 15 日合計（上市櫃）</div><div class="v ${cls(D.total)}">${yi(D.total)} 億</div></div>
      <div class="pb-k"><div class="t">買超第一名</div><div class="v" style="font-size:16px">${D.buy[0] ? esc(D.buy[0].n) + ` <span class="up">${yi(D.buy[0].sum)}</span>` : "—"}</div></div>
      <div class="pb-k"><div class="t">連續買超 ≥5 天</div><div class="v up">${D.n_cbuy} 檔</div></div>
      <div class="pb-k"><div class="t">連續賣超 ≥5 天</div><div class="v down">${D.n_csell} 檔</div></div>
    </div>
    <div class="pb-seg" id="pb-sub">${Object.entries(SUBS).map(([k, t]) => `<button data-v="${k}" class="${k === sub ? "on" : ""}">${t}</button>`).join("")}</div>
    <div class="pb-desc">${SUBDESC[sub]}。每日長條：紅＝買超、綠＝賣超（${T.dates[0]}→${T.dates[T.dates.length - 1]}）</div>
    <div class="pb-tw">${rows.length ? `<table><thead><tr><th class="n">#</th><th>名稱</th><th class="n">15日(億)</th><th class="hd">每日</th><th class="n hd">買／賣天數</th><th>連續</th><th class="n hd">今日(億)</th><th class="n">15日漲跌</th></tr></thead><tbody>
      ${rows.map((x, i) => `<tr><td class="pbrk">${i + 1}</td><td>${esc(x.n)}<span class="code">${x.c}</span><span class="sub">${esc(x.i)}${x.m ? "・" + x.m : ""}</span></td>
        <td class="n ${cls(x.sum)}"><b>${yi(x.sum)}</b></td><td class="hd">${spark(x.spark)}</td><td class="n hd">${x.bd}／${x.sd}</td>
        <td>${streak(x.st)}</td><td class="n hd ${cls(x.today)}">${yi(x.today)}</td><td class="n ${cls(x.ret)}">${pct(x.ret)}</td></tr>`).join("")}
      </tbody></table>` : `<div class="pb-empty">沒有符合的股票</div>`}</div>
    <div class="pb-note">範圍：${esc(T.scope)}。本區為資料整理，不構成投資建議。</div>`;
  document.querySelectorAll("#pb-sub button").forEach(b => b.onclick = () => { sub = b.dataset.v; tw(); });
}
function ma(x){ return `<span class="ma" title="站上 20／50／200 日均線">${[x.a20, x.a50, x.a200].map(v => v ? '<span class="up">●</span>' : '<span class="down">○</span>').join("")}</span>`; }
function us(){
  const U = P.us;
  if (!U){ $("pb-view").innerHTML = `<div class="pb-empty">美股資料尚未產生</div>`; return; }
  const rows = U.top.filter(x => !sec || x.sec === sec);
  $("pb-view").innerHTML = `
    <p class="pb-meta">美股交易日 ${U.date}（美東）・從 ${U.n} 檔中依成交值排序・產生 ${P.generated}${P.demo ? "・示範資料" : ""}</p>
    <div class="pb-kpis">
      <div class="pb-k"><div class="t">前 100 名成交值</div><div class="v">${U.top_dv.toFixed(0)} <span style="font-size:12px">億美元</span></div></div>
      <div class="pb-k"><div class="t">佔全部追蹤股票</div><div class="v">${(U.top_dv / U.total_dv * 100).toFixed(0)}%</div></div>
      <div class="pb-k"><div class="t">上漲／下跌</div><div class="v"><span class="up">${U.top.filter(x => x.ch > 0).length}</span>／<span class="down">${U.top.filter(x => x.ch < 0).length}</span></div></div>
      <div class="pb-k"><div class="t">站上 50 日線</div><div class="v">${U.top.filter(x => x.a50).length} 檔</div></div>
    </div>
    <div class="pb-desc">依產業篩選（數字：檔數・成交值億美元・平均漲跌）</div>
    <div class="pb-chips" id="pb-sec"><button class="pb-chip ${sec ? "" : "on"}" data-v="">全部 100</button>${U.sectors.map(g => `<button class="pb-chip ${g.k === sec ? "on" : ""}" data-v="${esc(g.k)}">${esc(g.k)} ${g.cnt}・${g.dv.toFixed(0)}・<span class="${cls(g.ch)}">${pct(g.ch)}</span></button>`).join("")}</div>
    <div class="pb-tw"><table><thead><tr><th class="n">#</th><th>股票</th><th class="n hd">價格</th><th class="n">漲跌</th><th class="n">成交值(億美元)</th><th class="n hd">量比</th><th class="n hd">5日</th><th class="n">20日</th><th class="n hd">今年</th><th class="hd">均線</th><th class="n hd">距高點</th><th class="n hd">RSI</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td class="pbrk">${x.rk}</td><td><b>${esc(x.s)}</b><span class="sub">${esc(x.n)}・${esc(x.sec)}</span></td>
        <td class="n hd">${x.p != null ? x.p.toFixed(2) : "—"}</td><td class="n ${cls(x.ch)}">${pct(x.ch)}</td><td class="n">${x.dv.toFixed(1)}</td>
        <td class="n hd ${x.vr >= 1.5 ? "up" : ""}">${x.vr != null ? x.vr.toFixed(1) + "x" : "—"}</td><td class="n hd ${cls(x.r5)}">${pct(x.r5)}</td><td class="n ${cls(x.r20)}">${pct(x.r20)}</td>
        <td class="n hd ${cls(x.ytd)}">${pct(x.ytd)}</td><td class="hd">${ma(x)}</td><td class="n hd">${pct(x.hi)}</td>
        <td class="n hd ${x.rsi >= 70 ? "up" : x.rsi <= 30 ? "down" : ""}">${x.rsi ?? "—"}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="pb-note">範圍：S&amp;P 500 成分股、不在 S&amp;P 500 的 Nasdaq-100 主要成分股，加上自選清單（ADR 與熱門股），不含 ETF。成交值＝收盤價 × 成交量；量比＝今日成交值 ÷ 前 20 日平均；均線 ●＝站上 20／50／200 日線；距高點＝距 52 週最高收盤。資料來源：Yahoo Finance，可能延遲或有誤差，不構成投資建議。</div>`;
  document.querySelectorAll("#pb-sec button").forEach(b => b.onclick = () => { sec = b.dataset.v; us(); });
}
function render(){
  document.querySelectorAll("#pb-top button").forEach(b => b.classList.toggle("on", b.dataset.v === top));
  top === "us" ? us() : tw();
}
document.querySelectorAll("#pb-top button").forEach(b => b.onclick = () => { top = b.dataset.v; render(); });
render();
})();
</script>
<!--PB-END-->
