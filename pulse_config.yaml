# =============================================================
#  盤中行情儀表板設定檔（存檔編碼請用 UTF-8）
# =============================================================

# 資料來源：twse（證交所免費資料，約 5 秒更新）或 shioaji（永豐 API，即時、全市場）
source: twse

# 每幾秒更新一次。證交所資料建議 60 秒以上，避免查詢太頻繁被暫時封鎖
interval_seconds: 60

# 永豐 Shioaji 設定（source: shioaji 時才需要）
shioaji:
  api_key: ""
  secret_key: ""
  full_market: true          # true＝抓全市場算漲跌家數與產業資金流向

# FinMind token：用來抓過去 20 日成交值當基準。留空會自動讀 config.yaml 的設定
finmind_token: ""

# -------------------------------------------------------------
# 手機推播（雲端版：token 由 GitHub Secrets 在執行時填入，這裡請保持空白）
# -------------------------------------------------------------
notify:
  telegram_bot_token: ""     # 跟 @BotFather 建立機器人後取得
  telegram_chat_id: ""       # 執行 python market_pulse.py --probe 會教你怎麼查
  discord_webhook: ""        # Discord 頻道設定 → 整合 → Webhook
  email_smtp_user: ""        # Gmail 帳號，例如 xxx@gmail.com
  email_app_password: ""     # Gmail「應用程式密碼」（不是登入密碼）
  email_to: ""               # 收件人
  # 定時摘要時間
  summary_times: ["09:30", "11:00", "13:00", "13:35"]
  # 盤中異常提醒（同一事件當天只提醒一次）
  alert_index_moves: [1.0, 2.0]       # 加權指數漲跌超過 1%、2% 提醒
  alert_group_move: 3.0               # 自訂族群平均漲跌超過 3% 提醒
  alert_holding_move: 5.0             # 個別持股漲跌超過 5% 提醒
  alert_label_change: true            # 行情判斷改變時提醒（9:15 後）
  label_confirm_minutes: 5            # 新的行情判斷要維持幾分鐘才算數（避免來回跳動）

# -------------------------------------------------------------
# 行情判斷門檻
# -------------------------------------------------------------
thresholds:
  pace_hot: 1.15             # 推估全日量 ≥ 20 日均量 1.15 倍＝有量
  pace_cold: 0.85            # ≤ 0.85 倍＝量縮
  hot_stock_min_amount: 1.0  # 爆量股名單只列 20 日均成交值 ≥ 1 億的股票

# -------------------------------------------------------------
# 自訂族群：證交所產業分類沒有光通訊、CCL、散熱，所以自己定義成分股
# 持股所在族群會在儀表板上標示，config.yaml 的台股持股也會自動加入監控
# -------------------------------------------------------------
my_groups: [光通訊, PCB/CCL, 散熱, 電力重電, 封測]

groups:
  光通訊:     ["4979", "3081", "3163", "6442", "3363", "4908", "3450", "2455"]
  PCB/CCL:    ["2383", "6274", "6213", "2368", "3037", "3044", "4958", "2313", "8046", "3189"]
  散熱:       ["3017", "3324", "3653", "6805", "2421"]
  電力重電:   ["1519", "1513", "1514", "1504", "1503"]
  封測:       ["3711", "2449", "6239", "6147"]
  記憶體:     ["2408", "2344", "2337"]
  AI伺服器:   ["2382", "3231", "6669", "2317", "2356", "4938", "2376"]
  IC設計:     ["2454", "3034", "2379", "3661", "3443"]
  晶圓代工:   ["2330", "2303"]
  網通:       ["2345", "3045", "2412"]
  被動元件:   ["2327", "2492", "2375"]
  金融:       ["2881", "2882", "2891", "2886", "2884", "2885", "2892", "5880", "2880", "2887"]
  航運:       ["2603", "2609", "2615"]
