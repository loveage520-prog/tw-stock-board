  const es = F.etfs.filter(e => e.k !== "風格");
  if (!fsel || !es.some(e => e.s === fsel)) fsel = (es.slice().sort((a, b) => (b.mf || 0) - (a.mf || 0))[0] || {}).s;
  const W = 600, H = 360, P_ = 34, xs = es.map(e => e.ch || 0), xm = Math.max(.005, ...xs.map(Math.abs)) * 1.15;
  const vrs = es.map(e => Math.log2(Math.max(.25, Math.min(8, e.vr || 1)))), ym = Math.max(1, ...vrs.map(Math.abs)) * 1.15;
  const X = v => P_ + (v + xm) / (2 * xm) * (W - 2 * P_), Y = v => H - P_ - (Math.log2(Math.max(.25, Math.min(8, v || 1))) + ym) / (2 * ym) * (H - 2 * P_);
  const dmax = Math.max(...es.map(e => e.dv || 0), 1);
  let g = `<line x1="${X(0)}" x2="${X(0)}" y1="${P_ - 10}" y2="${H - P_}" stroke="var(--ub-line)"/><line x1="${P_}" x2="${W - P_}" y1="${Y(1)}" y2="${Y(1)}" stroke="var(--ub-line)" stroke-dasharray="3 3"/>` +
    `<text x="${W - P_}" y="${Y(1) - 4}" text-anchor="end" font-size="10" fill="var(--ub-muted)">量比 1x（正常量）</text>` +
    `<text x="${W - P_}" y="${H - 8}" text-anchor="end" font-size="10" fill="var(--ub-muted)">漲 →</text><text x="${P_}" y="${H - 8}" font-size="10" fill="var(--ub-muted)">← 跌</text>` +
    `<text x="${P_}" y="${P_ - 14}" font-size="10" fill="var(--ub-muted)">↑ 量越大</text>`;
  es.slice().sort((a, b) => (b.dv || 0) - (a.dv || 0)).forEach(e => {
    const rr = 6 + Math.sqrt((e.dv || 0) / dmax) * 22, on = e.s === fsel, cx = X(e.ch || 0), cy = Y(e.vr);
    g += `<g data-f="${e.s}" style="cursor:pointer"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="${SC[e.st]}" fill-opacity="${on ? .95 : .7}" stroke="${on ? "var(--ub-fg)" : "var(--ub-card)"}" stroke-width="${on ? 3 : 1.5}"/>` +
      `<text x="${cx.toFixed(1)}" y="${(cy + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ub-fg)" paint-order="stroke" stroke="var(--ub-card)" stroke-width="3">${esc(e.n)}</text></g>`;
  });
  const cur = es.find(e => e.s === fsel);
  const det = cur ? `<div class="ub-card" style="margin:0"><h4><span style="color:${SC[cur.st]}">●</span> ${esc(cur.n)} <span class="sym" style="font-size:12px">${cur.s}</span> <small style="font-weight:600;color:${SC[cur.st]}">${esc(cur.st)}</small></h4>` +
    `<div class="pz-k" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><div class="t">漲跌</div><div class="v ${cls(cur.ch)}">${pct(cur.ch)}</div></div><div><div class="t">量比</div><div class="v">${cur.vr ?? "—"}x</div></div>` +
    `<div><div class="t">盤中資金流（億美元）</div><div class="v ${cls(cur.mf)}">${cur.mf > 0 ? "+" : ""}${fmt(cur.mf, 1)}</div></div><div><div class="t">成分股上漲</div><div class="v">${cur.mup}／${cur.mn}</div></div></div>` +
    `<p class="ub-meta" style="margin:8px 0 4px">成分股（依成交值）<button data-k="US:${cur.s}" data-kn="${esc(cur.n)} ETF" style="float:right;font-size:12px;border:1px solid var(--ub-line);border-radius:6px;background:none;cursor:pointer;padding:1px 8px">📈 ETF 日K</button></p>` +
    (cur.mem.length ? `<div class="ub-tw"><table><tbody>${cur.mem.map(m => `<tr data-k="US:${esc(m.s)}" data-kn="${esc(m.n)}" data-kp="${m.p}" data-kd="${U.date}"${m.o ? ` data-ko="${m.o}" data-kh="${m.h}" data-kl="${m.l}"` : ""}><td><span class="sym">${esc(m.s)}</span><span class="sub">${esc(m.n)}</span></td><td class="n">${fmt(m.p)}</td><td class="n">${chg(m.ch)}</td><td class="n">${fmt(m.dv, 1)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="ub-meta">沒有成分股資料</p>`) + `</div>` : "";
  h += `<div class="ub-card"><h4>盤中資金地圖 <small style="font-weight:400;color:var(--ub-muted)">泡泡＝產業／主題 ETF；越右越漲、越上量越大、泡泡越大成交值越大；點泡泡看成分股</small></h4>` +
    `<div class="pz-g"><div><svg class="pz" viewBox="0 0 ${W} ${H}" role="img" aria-label="美股盤中資金地圖">${g}</svg>` +
    `<div class="pz-chips">${Object.entries(SC).map(([k, c]) => `<span style="font-size:12px"><span style="color:${c}">●</span> ${k}</span>`).join("")}</div>` +
    `<div class="pz-chips">${es.map(e => `<button data-f="${e.s}" class="${e.s === fsel ? "on" : ""}" style="--c:${SC[e.st]}">${esc(e.n)} ${pct(e.ch, 1)}</button>`).join("")}</div></div>${det}</div></div>`;
  // 4) 資金流排行
  const fr = es.slice().sort((a, b) => (b.mf || 0) - (a.mf || 0)), fm = Math.max(...fr.map(e => Math.abs(e.mf || 0)), .1);
  h += `<div class="ub-card"><h4>盤中資金流向排行 <small style="font-weight:400;color:var(--ub-muted)">億美元；收盤越靠近今日高點、成交值越大，流入越多（估算）</small></h4>` +
    fr.map(e => { const w = Math.abs(e.mf || 0) / fm * 50, pos = (e.mf || 0) >= 0;
      return `<div class="pz-bar" data-f="${e.s}"><span>${esc(e.n)}</span><span class="tr"><span class="mid"></span><span class="b" style="background:${SC[e.st]};${pos ? "left:50%" : "right:50%"};width:${w.toFixed(1)}%"></span></span><span class="v ${cls(e.mf)}">${e.mf > 0 ? "+" : ""}${fmt(e.mf, 1)}</span></div>`; }).join("") + `</div>`;
  // 5) 盤中事件
  const ev = U.events || [];
  h += `<div class="ub-card"><h4>盤中事件 <small style="font-weight:400;color:var(--ub-muted)">每 5 分鐘比對一次</small></h4>` +
    (ev.length ? `<ul class="pz-ev">${ev.map(x => `<li class="${x.c === "up" ? "" : ""}">${esc(x.e)}<small>${esc(x.t)}</small></li>`).join("")}</ul>` : `<p class="ub-meta">目前沒有特別事件</p>`) + `</div>`;
  return h;
}

function spark(a){
  if (!a || a.length < 3) return "";
  const lo = Math.min(...a), hi = Math.max(...a), w = 120, h = 30, k = hi - lo || 1;
  const pts = a.map((v, i) => `${(i / (a.length - 1) * w).toFixed(1)},${(h - 2 - (v - lo) / k * (h - 4)).toFixed(1)}`).join(" ");
  const c = a[a.length - 1] >= a[0] ? "var(--ub-up)" : "var(--ub-down)";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="1.6" points="${pts}"/></svg>`;
}
function table(rows, cols){
  if (!rows || !rows.length) return `<div class="ub-tw"><p class="ub-meta" style="padding:16px;text-align:center">沒有資料</p></div>`;
  return `<div class="ub-tw"><table><thead><tr><th class="n">#</th>${cols.map(c => `<th class="${c[2] || ""}">${c[0]}</th>`).join("")}</tr></thead><tbody>` +
    rows.map((x, i) => `<tr${x.s ? ` data-k="US:${esc(x.s)}" data-kn="${esc(x.n)}"${x.p ? ` data-kp="${x.p}" data-kd="${U.date}"` : ""}` : ""}><td class="rk">${x.rk ?? i + 1}</td>${cols.map(c => `<td class="${c[2] || ""}">${c[1](x)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
}

function summary(){
  const idx = U.idx.map(x => `<div class="ub-k" data-k="US:${esc(x.s)}" data-kn="${esc(x.n)}" data-kp="${x.p}" data-kd="${U.date}"><div class="t">${esc(x.n)}</div><div class="v">${fmt(x.p)}</div><div class="s ${cls(x.ch)}">${pct(x.ch)}</div>${spark(x.sp)}</div>`).join("");
  const mini = U.fut.concat(U.mac).map(x => `<div><span>${esc(x.n)}</span><b>${x.u === "y" ? fmt(x.p) + "%" : fmt(x.p, x.p > 1000 ? 0 : x.p < 10 ? 3 : 2)} <span class="${cls(x.ch)}">${pct(x.ch)}</span></b></div>`).join("");
  let pts = "", head = "";
  if (U.state === "收盤" && U.summary) { pts = U.summary; head = `收盤重點（美東 ${esc(U.sess)}）`; }
  else if (U.last_close) { pts = U.last_close.summary; head = `上一交易日收盤重點（${esc(U.last_close.date.slice(5).replace("-", "/"))}）`; }
  const earn = (U.state === "收盤" ? U.earn : U.last_close && U.last_close.earn) || [];
  const card = pts && pts.length ? `<div class="ub-card"><h4>${head}</h4><ul>${pts.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : "";
  const ecard = earn.length ? `<div class="ub-card"><h4>近期財報</h4><ul>${earn.map(e => `<li>${esc(e.d.slice(5).replace("-", "/"))} <b class="sym">${esc(e.s)}</b> ${esc(e.n)}${e.tw ? "（台灣供應鏈）" : ""}${e.eps != null ? `，預估 EPS ${e.eps}` : ""}</li>`).join("")}</ul></div>` : "";
  return `<div class="ub-grid">${idx}</div><div class="ub-mini">${mini}</div>${card}${ecard}`;
}
function topv(){
  const ss = ["全部"].concat(U.sectors.map(g => g.k));
  const rows = sec === "全部" ? U.top : U.top.filter(x => x.sec === sec);
  return `<div class="ub-seg">${ss.map(s => `<button data-sec="${esc(s)}" class="${sec === s ? "on" : ""}">${esc(s)}</button>`).join("")}</div>` +
    `<p class="ub-meta">依今日成交值（億美元）排序；上漲 ${U.up}、下跌 ${U.dn} 檔</p>` +
    table(rows, [["股票", x => `<span class="sym">${esc(x.s)}</span><span class="sub">${esc(x.n)}</span>`], ["產業", x => esc(x.sec), "hd"],
                 ["價格", x => fmt(x.p), "n"], ["漲跌", x => chg(x.ch), "n"], ["成交值", x => fmt(x.dv, 1), "n"]]);
}
function secv(){
  return `<p class="ub-meta">成交值前 100 檔依產業彙整；漲跌為平均</p>` +
    table(U.sectors, [["產業", x => `<b>${esc(x.k)}</b>`], ["檔數", x => `${x.cnt}（漲 ${x.up}）`, "n"], ["平均漲跌", x => chg(x.ch), "n"], ["成交值(億美元)", x => fmt(x.dv, 1), "n"]]);
}
function chainv(){
  return `<p class="ub-meta">ADR 溢價＝ADR 價格 × 匯率 ÷（台股收盤 × 換算股數）− 1；台積電、聯電 1 ADR＝5 股，日月光＝2 股</p>` +
    table(U.chain, [["股票", x => `<span class="sym">${esc(x.s)}</span><span class="sub">${esc(x.n)}</span>`], ["價格", x => fmt(x.p), "n"], ["漲跌", x => chg(x.ch), "n"],
                    ["ADR 溢價", x => x.prem == null ? "—" : `<b>${pct(x.prem, 1)}</b>`, "n"], ["換算台股", x => x.eqv == null ? "—" : `${fmt(x.eqv, 1)}<span class="sub">台股 ${fmt(x.twp, 1)} ${pct(x.twch)}</span>`, "n hd"],
                    ["成交值", x => x.dv == null ? "—" : fmt(x.dv, 1), "n hd"]]);
}
function render(){
  const live = U.state === "盤中";
  $("ub-state").innerHTML = `<span class="pill ${live ? "live" : ""}">${esc(U.state)}</span>美東 ${esc(U.et)}｜台灣 ${esc(U.tw)} 更新｜開盤 ${U.open_tw}・收盤 ${U.close_tw}（台灣時間）`;
  $("ub-top").innerHTML = [["pulse", "💹 金流・脈動"], ["sum", "總覽・收盤重點"], ["top", "成交前 100"], ["sec", "產業"], ["chain", "台灣供應鏈・ADR"]]
    .map(([k, t]) => `<button data-top="${k}" class="${top === k ? "on" : ""}">${t}</button>`).join("");
  $("ub-view").innerHTML = ({pulse: pulseV, sum: summary, top: topv, sec: secv, chain: chainv})[top]() +
    `<div class="ub-note">資料來源：Yahoo Finance，盤中約延遲 15 分鐘；美股盤中每 5 分鐘更新網頁。點指數或個股可看日 K 技術線圖。僅供參考，不構成投資建議。</div>`;
}
$("ub").addEventListener("click", ev => {
  const b = ev.target.closest("[data-top],[data-sec],[data-f]");
  if (!b || ev.target.closest("[data-k]")) return;
  if (b.dataset.top) top = b.dataset.top;
  if (b.dataset.sec) sec = b.dataset.sec;
  if (b.dataset.f) { fsel = b.dataset.f; try { sessionStorage.setItem("ubF", fsel); } catch(e) {} }
  render();
});
try { fsel = sessionStorage.getItem("ubF") || null; const t0 = sessionStorage.getItem("ubTop"); } catch(e) {}
render();
})();
</script>
